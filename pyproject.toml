[project]
name = "llm-gateway-demo"
version = "0.1.0"
description = "Week 2 of the 12-week AI Agent roadmap: stable, configurable, testable model service with FastAPI (Pydantic Settings + Middleware + StreamingResponse + ConcurrencyLimiter)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.139.2",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langgraph>=1.2.10",
    "mcp>=1.29,<2",
    "numpy>=2.5.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.16.2",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.19.0",
    "rank-bm25>=0.2.2",
    "sse-starlette>=3.4.6",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
# Start from a focused default set; expand as the project grows.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RET",  # flake8-return
    "PTH",  # flake8-use-pathlib
]
ignore = [
    "E501", # line too long is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]  # allow assert in tests
"src/**/*.py"   = ["T201"]  # allow print in demo entrypoints
"scripts/run_real_ollama.py" = ["E402"]  # bootstrap: must add src/ to sys.path before local imports
"scripts/rag_week5_demo.py" = ["E402"]  # bootstrap: must add src/ to sys.path before local imports
"scripts/rag_week5_real_demo.py" = ["E402"]  # bootstrap: must add src/ to sys.path before local imports
"scripts/rag_week5_eval.py" = ["E402"]  # bootstrap: must add src/ to sys.path before local imports
"scripts/rag_week6_ingest.py" = ["E402"]  # bootstrap: must add src/ to sys.path before local imports
"scripts/rag_week6_qa.py" = ["E402"]  # bootstrap: must add src/ to sys.path before local imports
"scripts/rag_week6_param_compare.py" = ["E402"]  # bootstrap: must add src/ to sys.path before local imports
"scripts/mcp_week7_server.py" = ["E402"]  # bootstrap: must add src/ to sys.path before local imports
"scripts/mcp_week7_smoke.py" = ["E402"]  # bootstrap: must add src/ to sys.path before local imports
"scripts/graph_week8_*.py" = ["E402"]  # bootstrap: must add src/ to sys.path before local imports

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
]
