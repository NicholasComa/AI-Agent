    - data:
        code: "import ast\nimport math\nimport operator\n\n_MAX_LEN = 512\n_ALLOWED_OPS\
          \ = {\n    ast.Add: operator.add, ast.Sub: operator.sub, ast.Mult: operator.mul,\n\
          \    ast.Div: operator.truediv, ast.Mod: operator.mod,\n    ast.USub: operator.neg,\
          \ ast.UAdd: operator.pos,\n}\n_ALLOWED_NODES = (\n    ast.Expression, ast.BinOp,\
          \ ast.UnaryOp, ast.Constant,\n    ast.Add, ast.Sub, ast.Mult, ast.Div, ast.Mod,\
          \ ast.USub, ast.UAdd,\n)\n\ndef _result(value, error, kind, summary):\n\
          \    return {\"value\": value, \"error\": error, \"kind\": kind, \"summary\"\
          : summary}\n\ndef _eval_node(node):\n    if isinstance(node, ast.Expression):\n\
          \        return _eval_node(node.body)\n    if isinstance(node, ast.BinOp):\n\
          \        left = _eval_node(node.left); right = _eval_node(node.right)\n\
          \        op = _ALLOWED_OPS.get(type(node.op))\n        if op is None:\n\
          \            raise ValueError(f\"unsupported operator: {type(node.op).__name__}\"\
          )\n        return op(left, right)\n    if isinstance(node, ast.UnaryOp):\n\
          \        operand = _eval_node(node.operand)\n        op = _ALLOWED_OPS.get(type(node.op))\n\
          \        if op is None:\n            raise ValueError(f\"unsupported unary\
          \ op: {type(node.op).__name__}\")\n        return op(operand)\n    if isinstance(node,\
          \ ast.Constant):\n        if isinstance(node.value, bool):\n           \
          \ raise ValueError(\"booleans are not allowed\")\n        if not isinstance(node.value,\
          \ (int, float)):\n            raise ValueError(f\"non-numeric literal: {type(node.value).__name__}\"\
          )\n        return node.value\n    raise ValueError(f\"disallowed node: {type(node).__name__}\"\
          )\n\ndef main(expression: str) -> dict:\n    if not isinstance(expression,\
          \ str) or not expression.strip():\n        return _result(None, \"expression\
          \ is empty\", \"empty\",\n                        \"✗ 计算失败：expression is\
          \ empty（kind=empty）\")\n    if len(expression) > _MAX_LEN:\n        return\
          \ _result(None, f\"expression exceeds {_MAX_LEN} chars\", \"too_long\",\n\
          \                        f\"✗ 计算失败：expression exceeds {_MAX_LEN} chars（kind=too_long）\"\
          )\n    try:\n        tree = ast.parse(expression, mode=\"eval\")\n    except\
          \ SyntaxError as exc:\n        return _result(None, f\"invalid syntax: {exc.msg}\"\
          , \"syntax\",\n                        f\"✗ 计算失败：invalid syntax: {exc.msg}（kind=syntax）\"\
          )\n    for node in ast.walk(tree):\n        if not isinstance(node, _ALLOWED_NODES):\n\
          \            return _result(None, f\"unsupported syntax: {type(node).__name__}\"\
          , \"unsafe_node\",\n                            f\"✗ 计算失败：unsupported syntax:\
          \ {type(node).__name__}（kind=unsafe_node）\")\n    try:\n        value =\
          \ _eval_node(tree)\n    except ZeroDivisionError:\n        return _result(None,\
          \ \"division by zero\", \"domain\",\n                        \"✗ 计算失败：division\
          \ by zero（kind=domain）\")\n    except OverflowError:\n        return _result(None,\
          \ \"numeric overflow\", \"domain\",\n                        \"✗ 计算失败：numeric\
          \ overflow（kind=domain）\")\n    except ValueError as exc:\n        return\
          \ _result(None, str(exc), \"unsafe_node\",\n                        f\"\
          ✗ 计算失败：{exc}（kind=unsafe_node）\")\n    if isinstance(value, float) and not\
          \ math.isfinite(value):\n        return _result(None, \"result is not finite\
          \ (inf/nan)\", \"domain\",\n                        \"✗ 计算失败：result is not\
          \ finite (inf/nan)（kind=domain）\")\n    return _result(value, \"\", \"ok\"\
          , f\"✓ 计算成功：{expression} = {value}\")"
        code_language: python3
