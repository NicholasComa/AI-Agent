    - data:
        code: "import re\n\nALLOWED_TYPES = frozenset({\n    \"func\",\"feat\",\"\
          fix\",\"docs\",\"style\",\"conf\",\"perm\",\"version\",\"patch\",\n    \"\
          other\",\"refactor\",\"perf\",\"test\",\"chore\",\"build\",\"ci\",\"revert\"\
          ,\n})\nSUBJECT_MAX = 72\nBODY_LINE_MAX = 100\n_HEADER_RE = re.compile(\n\
          \    r\"^(?P<type>[A-Za-z]+)\"\n    r\"(?:\\((?P<pscope>[A-Za-z0-9_-]+)\\\
          )\"\n    r\"|(?::\\s*(?P<cscope>[A-Za-z0-9_-]+)))\"\n    r\":\\s(?P<subject>.+)$\"\
          \n)\n\ndef _parse_header(line):\n    m = _HEADER_RE.match(line)\n    if\
          \ not m:\n        return {\"type\": None, \"scope\": None, \"subject\":\
          \ None, \"breaking\": False}\n    scope = m.group(\"pscope\") or m.group(\"\
          cscope\")\n    return {\n        \"type\": m.group(\"type\").lower(),\n\
          \        \"scope\": scope,\n        \"subject\": m.group(\"subject\").strip(),\n\
          \        \"breaking\": False,\n    }\n\ndef main(message: str) -> dict:\n\
          \    errors = []\n    if not isinstance(message, str):\n        return {\n\
          \            \"valid\": \"invalid\",\n            \"errors\": [\"message\
          \ must be a string\"],\n            \"summary\": \"✗ 校验失败：message must be\
          \ a string\",\n            \"parsed_summary\": \"type=None, scope=None,\
          \ subject=None, breaking=False, has_body=False\",\n        }\n    if \"\\\
          n\" in message:\n        header, _, rest = message.partition(\"\\n\")\n\
          \    else:\n        header, rest = message, \"\"\n    header = header.rstrip(\"\
          \\r\")\n    rest = rest.replace(\"\\r\\n\", \"\\n\")\n    parsed = _parse_header(header)\n\
          \    has_body = bool(rest.strip())\n    if parsed[\"type\"] is None:\n \
          \       errors.append(\"header does not match `<type>(scope): subject`\"\
          )\n    else:\n        if parsed[\"type\"] not in ALLOWED_TYPES:\n      \
          \      errors.append(f\"type '{parsed['type']}' not allowed\")\n    if parsed[\"\
          subject\"] is not None and not parsed[\"subject\"].strip():\n        errors.append(\"\
          subject is empty\")\n    if len(header) > SUBJECT_MAX:\n        errors.append(f\"\
          header line is {len(header)} chars, max {SUBJECT_MAX}\")\n    if has_body:\n\
          \        for i, ln in enumerate(rest.splitlines(), start=2):\n         \
          \   if len(ln) > BODY_LINE_MAX:\n                errors.append(f\"body line\
          \ {i} is {len(ln)} chars, max {BODY_LINE_MAX}\")\n    parsed_summary = (\n\
          \        f\"type={parsed['type']}, scope={parsed['scope']}, \"\n       \
          \ f\"subject={parsed['subject']}, breaking={parsed['breaking']}, has_body={has_body}\"\
          \n    )\n    if errors:\n        summary = \"✗ 校验失败：\" + \"；\".join(errors)\n\
          \    else:\n        summary = f\"✓ 校验通过：{header.strip()}\"\n    return {\n\
          \        \"valid\": \"valid\" if not errors else \"invalid\",\n        \"\
          errors\": errors,\n        \"summary\": summary,\n        \"parsed_summary\"\
          : parsed_summary,\n    }"
        code_language: python3
        outputs:
          errors:
            children: null
            type: array[string]
          parsed_summary:
            children: null
            type: string
          summary:
            children: null
            type: string
          valid:
            children: null
            type: string
